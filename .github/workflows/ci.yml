name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Types
        run: mypy

      # Unit, integration and corpus tests. The integration tests launch a real MCP
      # server subprocess over stdio, so this covers the protocol path as well as the
      # policy logic. Nothing here needs an API key, a network or a GPU.
      - name: Tests
        run: pytest -q

      # The benchmark is part of CI rather than a manual step because the headline
      # numbers in the README are pinned by tests. If a control changes and the results
      # move, the build fails and the README has to be updated deliberately.
      - name: Benchmark
        run: python evaluation/benchmark.py

      # Proves the end-to-end proxy still works against a live subprocess.
      - name: Demo
        run: python -m mcp_policy_gateway.cli demo
